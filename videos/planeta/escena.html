const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),P=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,x)=>a+(b-a)*x;
const eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;const eback=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

function win(t,a,b,f=.4){return clamp(P(t,a-f,a))*(1-clamp(P(t,b,b+f)))}

const SEG=[[0.0,1.75,"La Tierra ya no es segura."],[2.29,4.97,"Una nave sale esta noche hacia un planeta nuevo…"],[5.51,7.53,"y solo quedan cien cápsulas."],

const CH=[];SEG.forEach(([a,b,txt])=>{const W=txt.split(' ');const w=W.map(x=>x.replace(/[^\wáéíóúñü]/gi,'').length+1.5);const tot=w.reduce((s,x)=>s+x,0);
